<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 4 - Table & Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="navbar">
    <a href="index.html">Task 1 (Home)</a>
    <a href="task2.html">Task 2 (Layout)</a>
    <a href="task3.html">Task 3 (Tribute)</a>
    <a href="task4.html">Task 4 (Table & Form)</a>
</nav>

<main class="task4-container">

    <h1 id="table-heading">Student Grades Report</h1>

    <table class="grades-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td>Almas</td>
            <td>Web Technologies</td>
            <td>95</td>
        </tr>
        <tr>
            <td>Aruzhan</td>
            <td>Calculus</td>
            <td>88</td>
        </tr>
        <tr class="highlight-row">
            <td>Imangali (Best Student)</td>
            <td>Biology</td>
            <td>100</td>
        </tr>
        <tr>
            <td>Berik</td>
            <td>Physics</td>
            <td>74</td>
        </tr>
        </tbody>
        <tfoot>
        <tr>
            <td colspan="2" class="merged-cell">Average Grade</td>
            <td>89.25</td>
        </tr>
        </tfoot>
    </table>

    <hr class="divider">

    <h1 id="form-heading">Feedback Form</h1>

    <form class="feedback-form">

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <label for="role">Your Role:</label>
        <select id="role" name="role">
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="other">Other</option>
        </select>

        <label>Did you like the course?</label>
        <div class="radio-group">
            <input type="radio" id="yes" name="liked_course" value="yes">
            <label for="yes">Yes</label>

            <input type="radio" id="no" name="liked_course" value="no">
            <label for="no">No</label>
        </div>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="4" placeholder="Write your feedback here..."></textarea>

        <button type="submit" id="submit-btn">Submit Feedback</button>

    </form>

</main>

<footer class="layout-footer">
    <p>&copy; 2026 Table and Form Practice</p>
</footer>

</body>
</html>
